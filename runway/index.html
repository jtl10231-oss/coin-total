<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>쮸앤택 Runway</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Runway">
<meta name="theme-color" content="#0f5f58">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#17202e;--mute:#6b7280;--line:#eceff3;--brand:#0f5f58;--ok:#15803d;--warn:#b45309;--danger:#dc2626;--life:#0ea5e9;--personal:#8b5cf6;--company:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:auto;padding:0 14px}
.topnav{display:flex;gap:6px;padding:max(10px,env(safe-area-inset-top)) 14px 8px;max-width:560px;margin:auto}
.topnav a{flex:1;text-align:center;padding:8px;border-radius:10px;text-decoration:none;color:var(--mute);background:#e7ebf0;font-weight:600;font-size:14px}
.topnav a.on{background:var(--brand);color:#fff}
.hero{background:linear-gradient(135deg,#0f5f58,#134e4a);color:#fff;border-radius:16px;padding:18px;margin:6px 0 12px}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hero-top b{font-size:19px}
.hero-sub{opacity:.8;font-size:13px;margin-top:2px}
.hero-nums{display:grid;grid-template-columns:1fr 1fr .7fr;gap:8px;margin-top:14px}
.hero-nums small{display:block;opacity:.75;font-size:11px}
.hero-nums b{font-size:15px}
.pill{padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:#fff}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.danger{color:var(--danger)}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.card h3 small{color:var(--mute);font-weight:400;font-size:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;align-items:baseline}
.row .k{color:var(--mute)}.row .v{font-weight:600;text-align:right}
.row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
.row.total .v{font-size:18px}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--mute);font-size:13px;line-height:1.55}
.up{color:var(--danger)}.down{color:#2563eb}.good{color:var(--ok)}.bad{color:var(--danger)}.warnc{color:var(--warn)}
.bar{height:10px;border-radius:6px;background:#edf0f4;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;border-radius:6px}
.bucket{padding:8px 0;border-top:1px solid var(--line)}.bucket:first-of-type{border-top:0}
.bucket .top{display:flex;justify-content:space-between;align-items:baseline}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.alerts .al{border-radius:12px;padding:11px 13px;margin-bottom:8px;font-size:14px;line-height:1.45}
.al.danger{background:#fdecec;color:#991b1b}.al.warn{background:#fff4e0;color:#92400e}.al.info{background:#eef4ff;color:#1e3a8a}
.al b{display:block;margin-bottom:2px}
.al span{font-size:12.5px;opacity:.9}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(0,0,0,.05);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.bottom{justify-content:center}.bottom button{flex:1;max-width:140px;border:0;background:none;padding:7px 0 9px;font-size:12.5px;color:#8b93a1;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bottom button i{display:flex;align-items:center;justify-content:center;width:52px;height:32px;border-radius:16px;transition:background .15s}
.bottom button svg{width:24px;height:24px}
.bottom button.on{color:var(--brand)}
.bottom button.on i{background:#dff3ef}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{border:1px solid #d6dbe2;background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px;color:var(--ink)}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--mute)}
input,select,textarea{width:100%;font-size:16px;padding:10px 11px;border:1px solid #d6dbe2;border-radius:10px;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:70px}
.btn{display:block;width:100%;border:0;border-radius:11px;padding:13px;font-size:15px;font-weight:700;background:var(--brand);color:#fff;margin-top:14px}
.btn.gray{background:#e7ebf0;color:var(--ink)}.btn.red{background:#fdecec;color:#b91c1c}
.btn[disabled]{opacity:.5}
.hint{font-size:12.5px;color:var(--mute);margin-top:4px;line-height:1.5}
.list .it{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.list .it:first-child{border-top:0}
.it .t{font-weight:600;font-size:14px}.it .s{font-size:12.5px;color:var(--mute);margin-top:2px;line-height:1.45}
.it.cx{opacity:.45}.it.cx .t{text-decoration:line-through}
.mini{border:1px solid #d6dbe2;background:#fff;border-radius:8px;padding:5px 9px;font-size:12.5px;color:var(--ink);white-space:nowrap}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
table.tb th{color:var(--mute);font-weight:600;text-align:right;padding:5px 3px;border-bottom:1px solid var(--line)}
table.tb td{text-align:right;padding:6px 3px;border-bottom:1px solid #f5f6f8}
table.tb th:first-child,table.tb td:first-child{text-align:left}
.screen{max-width:420px;margin:30px auto;padding:0 18px}
.lockcard{background:#fff;border-radius:16px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.lockcard h2{margin:0 0 6px;font-size:20px}
.seg{display:flex;gap:8px}.two{display:flex;gap:8px}.pick{display:flex;gap:10px;margin-top:14px}.pick .btn{flex:1;font-size:22px;padding:20px;margin-top:0}.seg label{flex:1;border:1px solid #d6dbe2;border-radius:10px;padding:11px;text-align:center;font-weight:700}
.seg input{display:none}.seg input:checked+span{color:var(--brand)}
.seg label:has(input:checked){border-color:var(--brand);background:#ecfdf5}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#17202e;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90%}
#toast.on{opacity:.95}
.qr{display:flex;justify-content:center;margin:12px 0}.qr svg{width:220px;height:220px}
.muted{color:var(--mute)}
[hidden]{display:none!important}
.donut-wrap{display:flex;align-items:center;gap:14px;margin:4px 0 10px}.donut{width:150px;height:150px;flex:none}
.legend{flex:1;min-width:0}.lg{display:grid;grid-template-columns:12px 1fr auto;column-gap:6px;row-gap:0;align-items:baseline;padding:4px 0;border-top:1px solid var(--line)}.lg:first-child{border-top:0}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}.lg span{font-size:13.5px;color:var(--mute)}.lg b{font-size:14px;text-align:right}.lg small{grid-column:2/4;color:var(--mute);font-size:11.5px}
.spark{width:100%;height:74px;display:block;margin:6px 0 2px}
.hero-save{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.2);font-size:13px;opacity:.95}.hero-save b{font-size:15px}
</style>
<script src="core.js?v=20260928d"></script>
<script src="qrcode.js?v=20260928d"></script>
</head>

</div>
