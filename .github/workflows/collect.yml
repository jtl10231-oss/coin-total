name: collect-coinone
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: collect
        run: |
          git fetch origin data || true
          node collect.mjs /tmp/history.json
          node forecast.mjs /tmp/forecast.json || true
      - name: publish to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-new
          git rm -rf -q --cached .
          cp /tmp/history.json history.json
          git add history.json
          if [ -f /tmp/forecast.json ]; then cp /tmp/forecast.json forecast.json; git add forecast.json; fi
          git commit -q -m "history update"
          git push -f origin data-new:data
