name: collect-coinone
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: watchdog (scheduled)
        if: github.event_name == 'schedule'
        env:
          RUNWAY_DISPATCH_TOKEN: ${{ secrets.RUNWAY_DISPATCH_TOKEN }}
        run: |
          bash runway_tick.sh || true
          running=$(gh run list -R "$GITHUB_REPOSITORY" --workflow collect.yml --event workflow_dispatch --status in_progress --json databaseId --jq 'length')
          queued=$(gh run list -R "$GITHUB_REPOSITORY" --workflow collect.yml --event workflow_dispatch --status queued --json databaseId --jq 'length')
          echo "running=$running queued=$queued"
          bash publish.sh || true
          if [ "$running" = "0" ] && [ "$queued" = "0" ]; then gh workflow run collect.yml -R "$GITHUB_REPOSITORY" --ref main; fi
      - name: collect every minute (about 5h40m)
        if: github.event_name == 'workflow_dispatch'
        env:
          RUNWAY_DISPATCH_TOKEN: ${{ secrets.RUNWAY_DISPATCH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRICE_ALERT: '1'
        run: |
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            bash publish.sh || echo "publish failed, retry next minute"
            bash runway_tick.sh || true
            took=$(( $(date +%s) - start ))
            if [ "$took" -lt 60 ]; then sleep $(( 60 - took )); fi
          done
      - name: start next run
        if: always() && github.event_name == 'workflow_dispatch'
        run: gh workflow run collect.yml -R "$GITHUB_REPOSITORY" --ref main
